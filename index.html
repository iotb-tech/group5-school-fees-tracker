<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>School Fees Tracker</title> 
  <script src="https://cdn.tailwindcss.com"></script> 
</head> 
<body class="bg-gray-100 min-h-screen p-4"> 
  <div class="max-w-4xl mx-auto"> 
    <h1 class="text-3xl font-bold text-center text-indigo-800 mb-6">  School Fees Tracker</h1> 
 
    <form id="childForm" class="bg-white p-6 rounded-xl shadow-md mb-6"> 
      <h2 class="text-xl font-semibold mb-4">Add a Child</h2> 
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4"> 
        <input type="text" id="childName" placeholder="Child's Name" required class="border p-2 
rounded"> 
        <input type="text" id="schoolName" placeholder="School Name" required class="border 
p-2 rounded"> 
        <input type="number" id="totalFees" placeholder="Total Fees (₦)" required class="border 
p-2 rounded"> 
        <input type="number" id="paidAmount" placeholder="Paid So Far (₦)" required 
class="border p-2 rounded"> 
        <input type="date" id="dueDate" required class="border p-2 rounded">
        <input type="hidden" id="editId" value="">
        <button type="submit" id="submitBtn" class="md:col-span-2 bg-indigo-600 text-white py-2 rounded 
hover:bg-indigo-700">Add Child</button> 
      </div> 
    </form> 
 
    <div class="flex flex-col sm:flex-row gap-4 mb-6"> 
      <input type="text" id="searchInput" placeholder="Search by name or school..." class="flex-1 
border p-2 rounded"> 
      <select id="filterStatus" class="border p-2 rounded"> 
        <option value="all">All</option> 
        <option value="owing">Owing</option> 
        <option value="paid">Fully Paid</option> 
      </select> 
    </div> 
 
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6"> 
      <div class="bg-white p-4 rounded-xl shadow text-center"> 
        <p class="text-gray-500">Total Paid</p> 
        <p id="totalPaid" class="text-2xl font-bold text-green-600">₦0</p> 
      </div> 
      <div class="bg-white p-4 rounded-xl shadow text-center"> 
        <p class="text-gray-500">Total Outstanding</p> 
        <p id="totalOwing" class="text-2xl font-bold text-red-600">₦0</p> 
      </div> 
      <div class="bg-white p-4 rounded-xl shadow text-center"> 
        <p class="text-gray-500">Children</p> 
        <p id="childCount" class="text-2xl font-bold">0</p> 
      </div> 
    </div> 
 
    <div id="childrenList" class="space-y-3"></div> 
  </div> 
 
  <script src="js/data.js"></script> 
  <script src="js/display.js"></script> 
  <script src="js/search.js"></script> 
  <script src="js/ui.js"></script> 
</body> 
</html>
